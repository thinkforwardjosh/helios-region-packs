name: Sync Minerva Region Pack Manifest

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate minerva-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ORG="Think-Forward-Studios"
          API="https://api.github.com"

          REPOS=""
          for page in 1 2; do
            BATCH=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$API/orgs/$ORG/repos?per_page=100&type=all&page=$page" \
              | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r['name'].startswith('helios-packs-'):
                  print(r['name'])
          " || true)
            REPOS="$REPOS"$'\n'"$BATCH"
          done

          REPOS=$(echo "$REPOS" | sort -u | grep -v '^$')
          echo "Found $(echo "$REPOS" | wc -l) pack repos"

          python3 << 'PYEOF'
          import json, subprocess, os
          from datetime import datetime, timezone

          org = "Think-Forward-Studios"
          token = os.environ["GITHUB_TOKEN"]
          repos_raw = os.popen("echo \"$REPOS\"").read() if False else ""
          
          # Re-fetch repos since shell variable doesn't pass into heredoc
          import urllib.request
          all_repos = []
          for page in [1, 2]:
              url = f"https://api.github.com/orgs/{org}/repos?per_page=100&type=all&page={page}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}"
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                      for r in data:
                          if r["name"].startswith("helios-packs-"):
                              all_repos.append(r["name"])
              except Exception as e:
                  print(f"Page {page}: {e}")

          print(f"Scanning {len(all_repos)} repos...")

          all_packs = []
          for repo in sorted(all_repos):
              try:
                  url = f"https://api.github.com/repos/{org}/{repo}/releases/latest"
                  req = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}"
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      release = json.loads(resp.read())
                  tag = release.get("tag_name", "")
                  published = release.get("published_at", "")
                  for asset in release.get("assets", []):
                      name = asset.get("name", "")
                      if name.endswith(".regionpack.tar"):
                          pack_id = name.replace(".regionpack.tar", "")
                          all_packs.append({
                              "id": pack_id,
                              "name": pack_id,
                              "repo": repo,
                              "tag": tag,
                              "version": tag,
                              "published_at": published,
                              "size_bytes": asset.get("size", 0),
                              "download_url": asset.get("browser_download_url", "")
                          })
                          print(f"  {repo}: {pack_id} ({asset.get('size',0)} bytes)")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      pass  # No releases
                  else:
                      print(f"  {repo}: HTTP {e.code}")
              except Exception as e:
                  print(f"  {repo}: {e}")

          all_packs.sort(key=lambda p: p.get("name", ""))
          manifest = {
              "version": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "generated_by": "sync-minerva-manifest.yml",
              "app": "minerva-ios",
              "pack_count": len(all_packs),
              "regions": all_packs
          }
          with open("minerva-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"\nManifest: {len(all_packs)} packs written")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add minerva-manifest.json
          if git diff --cached --quiet; then
            echo "No changes to minerva-manifest.json"
          else
            git commit -m "Update minerva-manifest.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
